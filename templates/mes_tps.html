{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h3>Mes demandes de TP</h3>
    
    <!-- Sélecteur de niveau -->
    <div class="d-flex align-items-center gap-2 mb-3">
        <select id="levelSelect" class="form-select w-auto">
            <option value="">-- Choisir un niveau --</option>
            <!-- Niveaux gérés dans /admin/niveaux -->
            {% for l in levels %}
            <option value="{{ l.name }}">{{ l.name }}</option>
            {% endfor %}
        </select>
        <button id="btnNewTp" class="btn btn-success">+ Nouveau TP</button>
        <button id="btnNewChapter" class="btn btn-outline-secondary" title="Ranger vos TP par chapitre (facultatif)">+ Dossier</button>
    </div>

    <!-- Liste de mes TPs -->
    <div id="tp-list"></div>
    
    <hr>
    
    <!-- Section autres enseignants (cachée par défaut) -->
    <button id="btnVoirAutres" class="btn btn-outline-secondary">
        Voir les TPs des autres enseignants
    </button>
    
    <div id="autres-section" style="display:none">
        <select id="otherTeacherSelect" class="form-select w-auto mb-2">
            {% for t in teachers %}
            <option value="{{ t.id }}">{{ t.name }}</option>
            {% endfor %}
        </select>
        <select id="otherLevelSelect" class="form-select w-auto mb-3">
            <option value="">-- Choisir un niveau --</option>
            {% for l in levels %}
            <option value="{{ l.name }}">{{ l.name }}</option>
            {% endfor %}
        </select>
        <div id="autres-tp-list"></div>
    </div>
</div>

<!-- Création / modification d'un dossier (numéro et/ou nom) -->
<div class="modal fade" id="chapterModal" tabindex="-1" aria-labelledby="chapterModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="chapterModalLabel">Nouveau dossier</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="chapterId">
                <div class="input-group">
                    <span class="input-group-text">Chapitre</span>
                    <input type="number" id="chapterNumber" class="form-control" min="0" style="max-width: 6rem;" aria-label="Numéro du chapitre">
                    <span class="input-group-text">:</span>
                    <input type="text" id="chapterTitle" class="form-control" placeholder="Les ions" aria-label="Nom du chapitre">
                </div>
                <div class="form-text">Numéro, nom, ou les deux.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" id="btnSaveChapter">Enregistrer</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
{% include '_request_modal.html' %}
<script src="{{ asset('js/request_modal.js') }}"></script>
<!-- Glisser-déposer des TP entre dossiers (fonctionne aussi au doigt sur tablette) -->
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="{{ asset('js/pages/mes_tps.js') }}"></script>
{% endblock %}
