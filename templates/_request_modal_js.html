<script>
// Valeurs calculées par Flask, lues par static/js/request_modal.js (qui est un fichier
// statique : il ne peut pas contenir de Jinja). Si request_modal.js change,
// incrémenter le ?v= ci-dessous pour forcer le rechargement dans les navigateurs.
window.APP_CONFIG = {
    userMode: {{ effective_user_mode | tojson }},
    myTeacherId: {{ ((current_user.get('teacher_id') if current_user else None) or None) | tojson }},
    dureesParNiveau: { {% for l in levels %}{{ l.name | tojson }}: {{ l.default_duration or 85 }}{{ ',' if not loop.last }}{% endfor %} }
};
</script>
<script src="{{ url_for('static', filename='js/request_modal.js') }}?v=2026101501"></script>
